
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Munhé Nutrição</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --bege: #f7f2e9;
  --branco: #fffdf8;
  --verde: #48583d;
  --verde-claro: #e7e4d7;
  --terracota: #ad7958;
  --texto: #2f352b;
  --cinza: #6e7167;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bege);
  color: var(--texto);
  font-family: 'DM Sans', sans-serif;
  line-height: 1.7;
}

a {
  color: inherit;
  text-decoration: none;
}

header {
  border-bottom: 1px solid #e4dbcc;
  background: var(--bege);
  padding: 20px 6%;
}

nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 25px;
  flex-wrap: wrap;
}

.logo {
  color: var(--verde);
  font-family: 'Playfair Display', serif;
  font-size: 25px;
  letter-spacing: 4px;
}

.logo small {
  display: block;
  text-align: center;
  color: var(--terracota);
  font-family: 'DM Sans', sans-serif;
  font-size: 10px;
  letter-spacing: 5px;
}

.menu {
  display: flex;
  gap: 22px;
  flex-wrap: wrap;
  align-items: center;
}

.menu a {
  font-size: 14px;
  transition: color .2s;
}

.menu a:hover {
  color: var(--terracota);
}

.container {
  width: min(1050px, 88%);
  margin: auto;
}

main {
  min-height: 65vh;
}

.hero {
  display: grid;
  grid-template-columns: 1.2fr .8fr;
  gap: 45px;
  align-items: center;
  padding: 85px 0;
}

h1, h2, h3 {
  font-family: 'Playfair Display', serif;
  font-weight: 500;
  line-height: 1.2;
}

h1 {
  font-size: clamp(40px, 5vw, 65px);
  margin: 15px 0;
}

h2 {
  font-size: clamp(32px, 4vw, 45px);
}

h3 {
  font-size: 24px;
}

.eyebrow {
  color: var(--terracota);
  text-transform: uppercase;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 3px;
}

p {
  color: var(--cinza);
}

.hero p {
  font-size: 18px;
}

.logo-art {
  background: var(--verde-claro);
  border: 1px solid #d4c6b3;
  border-radius: 50%;
  width: min(100%, 340px);
  aspect-ratio: 1;
  margin: auto;
  display: grid;
  place-items: center;
  text-align: center;
}

.logo-art span {
  color: var(--verde);
  font-family: 'Playfair Display', serif;
  font-size: 100px;
}

.logo-art small {
  display: block;
  color: var(--terracota);
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  letter-spacing: 5px;
}

.button {
  display: inline-block;
  background: var(--verde);
  color: white;
  padding: 13px 22px;
  margin: 8px 8px 8px 0;
  border: 1px solid var(--verde);
  transition: .2s;
}

.button:hover {
  background: var(--terracota);
  border-color: var(--terracota);
}

.button.light {
  background: transparent;
  color: var(--verde);
}

.section {
  padding: 65px 0;
}

.panel {
  background: var(--branco);
  padding: 30px;
  border: 1px solid #e4dbcc;
}

.cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-top: 30px;
}

.card {
  background: var(--branco);
  border: 1px solid #e4dbcc;
  padding: 25px;
}

.card h3 {
  color: var(--verde);
}

.contact {
  max-width: 650px;
}

input, textarea, select {
  width: 100%;
  padding: 13px;
  margin: 6px 0 17px;
  border: 1px solid #d8cebd;
  background: var(--branco);
  font: inherit;
}

textarea {
  min-height: 120px;
}

footer {
  background: var(--verde);
  color: white;
  padding: 30px 6%;
  margin-top: 45px;
}

footer p {
  color: #e5e6dc;
  font-size: 13px;
}

@media (max-width: 750px) {
  header {
    padding: 20px 5%;
  }

  nav {
    flex-direction: column;
  }

  .menu {
    justify-content: center;
    gap: 12px 18px;
  }

  .hero {
    grid-template-columns: 1fr;
    padding: 50px 0;
  }

  .logo-art {
    width: 250px;
  }

  .logo-art span {
    font-size: 75px;
  }

  .cards {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>
  <nav>
    <a class="logo" href="?pagina=inicio" target="_blank">
      MUNHÉ
      <small>NUTRIÇÃO</small>
    </a>

    <div class="menu">
      <a href="?pagina=inicio" target="_blank">Início</a>
      <a href="?pagina=sobre" target="_blank">Sobre</a>
      <a href="?pagina=nutricao" target="_blank">Nutrição</a>
      <a href="?pagina=servicos" target="_blank">Consultas</a>
      <a href="?pagina=conteudos" target="_blank">Conteúdos</a>
      <a href="?pagina=contato" target="_blank">Contato</a>
    </div>
  </nav>
</header>

<main class="container" id="conteudo"></main>

<footer>
  <div class="logo">MUNHÉ <small>NUTRIÇÃO</small></div>
  <p>Nutrição com cuidado, conhecimento e propósito.</p>
  <p>© <span id="ano"></span> Munhé Nutrição.</p>
</footer>

<script>
const paginas = {
  inicio: `
    <section class="hero">
      <div>
        <span class="eyebrow">Nutrição com cuidado e propósito</span>
        <h1>Uma relação mais leve com a alimentação.</h1>
        <p>Pequenas escolhas, orientação e acolhimento para construir uma rotina alimentar que faça sentido para você.</p>
        <a class="button" href="?pagina=contato" target="_blank">Agendar consulta ↗</a>
        <a class="button light" href="?pagina=sobre" target="_blank">Conheça a Vitória</a>
      </div>
      <div class="logo-art">
        <div><span>M</span><small>NUTRIÇÃO</small></div>
      </div>
    </section>

    <section class="section">
      <span class="eyebrow">Nosso propósito</span>
      <h2>Cuidar da alimentação é cuidar de você.</h2>
      <p>Um espaço para aprender, desenvolver hábitos e encontrar equilíbrio sem fórmulas prontas.</p>
      <div class="cards">
        <article class="card">
          <h3>Individualidade</h3>
          <p>Cada pessoa tem uma história, necessidades e uma rotina própria.</p>
        </article>
        <article class="card">
          <h3>Equilíbrio</h3>
          <p>Hábitos possíveis e sustentáveis para a vida real.</p>
        </article>
        <article class="card">
          <h3>Conhecimento</h3>
          <p>Informação clara para fazer escolhas com autonomia.</p>
        </article>
      </div>
    </section>
  `,

  sobre: `
    <section class="section">
      <span class="eyebrow">Sobre a profissional</span>
      <h1>Prazer, sou Vitória Munhé.</h1>
      <div class="panel">
        <p>Meu objetivo é ajudar pessoas a desenvolverem uma relação mais consciente e equilibrada com a alimentação.</p>
        <p>O acompanhamento nutricional considera a individualidade, os hábitos, as preferências e as necessidades de cada pessoa.</p>
        <p><strong>Personalize esta página:</strong> acrescente a biografia real da Vitória, sua formação, registro no CRN, especializações e experiência profissional.</p>
      </div>
      <a class="button" href="?pagina=contato" target="_blank">Entre em contato</a>
    </section>
  `,

  nutricao: `
    <section class="section">
      <span class="eyebrow">Informação e bem-estar</span>
      <h1>O que é nutrição?</h1>
      <p>Nutrição é a área que estuda como os alimentos e seus nutrientes participam do funcionamento do organismo e da manutenção da saúde.</p>
      <div class="cards">
        <article class="card">
          <h3>Alimentação equilibrada</h3>
          <p>Variedade de alimentos e escolhas adequadas às necessidades individuais.</p>
        </article>
        <article class="card">
          <h3>Hábitos alimentares</h3>
          <p>Organização das refeições considerando preferências e rotina.</p>
        </article>
        <article class="card">
          <h3>Educação nutricional</h3>
          <p>Aprender a interpretar informações e desenvolver autonomia alimentar.</p>
        </article>
      </div>
      <p>O plano alimentar deve ser individualizado por um profissional habilitado.</p>
    </section>
  `,

  servicos: `
    <section class="section">
      <span class="eyebrow">Como funciona o atendimento</span>
      <h1>Consultas e acompanhamento.</h1>
      <p>Conheça as possibilidades de atendimento oferecidas pela Munhé Nutrição.</p>
      <div class="cards">
        <article class="card">
          <h3>Consulta nutricional</h3>
          <p>Avaliação individual das necessidades, hábitos e objetivos alimentares.</p>
        </article>
        <article class="card">
          <h3>Acompanhamento</h3>
          <p>Revisão de estratégias e acompanhamento da evolução ao longo do tempo.</p>
        </article>
        <article class="card">
          <h3>Educação alimentar</h3>
          <p>Orientações para desenvolver hábitos alimentares mais conscientes.</p>
        </article>
      </div>
      <p>Confirme quais serviços, modalidades e formatos de atendimento a profissional oferece.</p>
      <a class="button" href="?pagina=contato" target="_blank">Consultar disponibilidade</a>
    </section>
  `,

  conteudos: `
    <section class="section">
      <span class="eyebrow">Caderno Munhé</span>
      <h1>Informação que nutre.</h1>
      <p>Um espaço para aprender mais sobre alimentação e bem-estar.</p>
      <div class="cards">
        <article class="card">
          <h3>Organização alimentar</h3>
          <p>Como planejar refeições de acordo com o tempo e a rotina.</p>
        </article>
        <article class="card">
          <h3>Comer com equilíbrio</h3>
          <p>Entenda a importância da variedade e dos hábitos individuais.</p>
        </article>
        <article class="card">
          <h3>Mitos da alimentação</h3>
          <p>Aprenda a questionar informações nutricionais e buscar fontes confiáveis.</p>
        </article>
      </div>
      <p>Estes são temas iniciais. Acrescente artigos revisados pela nutricionista.</p>
    </section>
  `,

  contato: `
    <section class="section contact">
      <span class="eyebrow">Vamos conversar</span>
      <h1>Entre em contato.</h1>
      <p>Preencha os campos para preparar uma mensagem para a nutricionista.</p>

      <form id="formContato">
        <label for="nome">Seu nome</label>
        <input id="nome" name="nome" required placeholder="Digite seu nome">

        <label for="email">Seu e-mail</label>
        <input id="email" name="email" type="email" required placeholder="voce@email.com">

        <label for="assunto">Motivo do contato</label>
        <select id="assunto" name="assunto">
          <option>Agendamento de consulta</option>
          <option>Dúvidas sobre atendimento</option>
          <option>Outras informações</option>
        </select>

        <label for="mensagem">Mensagem</label>
        <textarea id="mensagem" name="mensagem" required placeholder="Escreva sua mensagem"></textarea>

        <button class="button" type="submit">Enviar pelo WhatsApp ↗</button>
      </form>

      <p>Instagram: adicione aqui o perfil oficial.</p>
      <p>E-mail: adicione aqui o e-mail profissional.</p>
    </section>
  `
};

const parametros = new URLSearchParams(window.location.search);
const pagina = parametros.get("pagina") || "inicio";

document.getElementById("conteudo").innerHTML =
  paginas[pagina] || paginas.inicio;

document.getElementById("ano").textContent =
  new Date().getFullYear();

const formulario = document.getElementById("formContato");

if (formulario) {
  formulario.addEventListener("submit", function(event) {
    event.preventDefault();

    // Substitua pelo número real, incluindo o código do país.
    const telefone = "5500000000000";

    const nome = document.getElementById("nome").value;
    const email = document.getElementById("email").value;
    const assunto = document.getElementById("assunto").value;
    const mensagem = document.getElementById("mensagem").value;

    const texto =
      "Olá! Meu nome é " + nome +
      ". Meu e-mail é " + email +
      ". Assunto: " + assunto +
      ". Mensagem: " + mensagem;

    const url = "https://wa.me/" + telefone +
      "?text=" + encodeURIComponent(texto);

    window.open(url, "_blank");
  });
}
</script>

</body>
</html>
